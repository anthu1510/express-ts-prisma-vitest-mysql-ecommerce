name: Tests

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        id: tests
        run: npm run test:run

      - name: Tests Passed ✅
        if: success()
        run: echo "::notice::All tests passed successfully! ✅"

      - name: Tests Failed ❌
        if: failure()
        run: echo "::error::Some tests failed! ❌ Please check the logs above."

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Add PR Comment
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const status = '${{ steps.tests.outcome }}' === 'success' ? '✅ **Tests Passed**' : '❌ **Tests Failed**';
            const body = `## Test Results\n\n${status}\n\n[View Details](${context.payload.pull_request.html_url}/checks)`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
